[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zero_trust_ai_api"
version = "3.0.0"
description = "Enterprise Zero-Trust AI Alignment Proxy featuring Prompt Injection Firewalls and PII Data Loss Prevention."
authors = [{ name = "Masthan Shaik", email = "masthan@example.com" }]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.103.0",
    "pydantic>=2.0.0",
    "transformers>=4.31.0",
    "presidio-analyzer>=2.2.35",
    "presidio-anonymizer>=2.2.35"
]

[project.optional-dependencies]
dev = ["black", "pytest"]
